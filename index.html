<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홍길동 | 자기소개</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>홍길동</h1>
    <p class="tagline">호기심 많고 꾸준히 성장하는 사람입니다.</p>
  </header>

  <main>
    <section class="section" id="about">
      <h2>소개</h2>
      <p>
        안녕하세요, 홍길동입니다. 새로운 것을 배우고 만들어 보는 것을 좋아합니다.
        작은 것부터 차근차근 쌓아 올리며 매일 조금씩 나아지는 것을 목표로 하고 있습니다.
      </p>
    </section>

    <section class="section" id="favorites">
      <h2>좋아하는 것 3가지</h2>
      <ul class="cards">
        <li class="card">
          <span class="icon">📚</span>
          <h3>독서</h3>
          <p>다양한 분야의 책에서 새로운 생각을 얻습니다.</p>
        </li>
        <li class="card">
          <span class="icon">🎧</span>
          <h3>음악</h3>
          <p>작업할 때나 쉴 때나 늘 음악과 함께합니다.</p>
        </li>
        <li class="card">
          <span class="icon">🚶</span>
          <h3>산책</h3>
          <p>걸으며 머리를 식히고 아이디어를 정리합니다.</p>
        </li>
      </ul>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> 홍길동. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
